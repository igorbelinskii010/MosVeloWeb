# Настройки карты для проверки (шаг 4, src/04_map_check.py). Меняем здесь, а не в коде.

# Цвета уровней LTS (задание block1.md, шаг 4)
lts_colors:
  1: "#1a9641"   # зелёный
  2: "#2b83ba"   # синий
  3: "#fdae61"   # оранжевый
  4: "#d7191c"   # красный
line_weight: 3

# Пунктир: участок, у которого скорость или полосы взяты по умолчанию (нет тега в OSM).
# Решение автора 31.10.2026: видно, где оценка держится на допущении.
# Проверяем только у улиц с машинами - у дорожек скорость и полосы на уровень не влияют.
dashed_for_infra: [none, lane]
dash_pattern: "6 6"   # 6 пикселей линия, 6 пикселей пропуск

# Стыки спокойной сети с LTS 4: узлы, где участок LTS 1-2 сети «по ПДД» касается участка LTS 4.
# Это кандидаты для проверки правила барьера (А или Б) - переходы и перекрёстки.
junction_color: "#000000"
junction_radius: 4

# Точки притяжения: цвет кружка по категории
poi_colors:
  metro_mcd: "#7b3294"
  train_station: "#c51b7d"
  university: "#e66101"
  office: "#636363"
  park: "#4dac26"
poi_names:
  metro_mcd: "метро и МЦД"
  train_station: "вокзал"
  university: "вуз"
  office: "офис"
  park: "парк"

# Прозрачность подложки OSM (0 - не видно, 1 - как есть)
tiles_opacity: 0.6

# Стартовый масштаб (центр карты = центр границы ЦАО)
zoom: 14
