# Настройки шага 1 (скачивание данных). Меняем здесь, а не в коде.
place_query: "Центральный административный округ, Москва, Россия"
buffer_m: 300            # запас вокруг ЦАО, чтобы не терять связи на краю округа
simplify_m: 20           # упрощаем контур буфера (точность 20 м), чтобы запрос к серверу был короче
expected_area_km2: [55, 80]   # проверка: площадь ЦАО должна быть около 66 км²
metric_crs: "EPSG:32637" # UTM 37N, для длин и площадей
# Сервер Overpass, откуда качаем улицы и точки. Если основной не отвечает,
# поставь один из запасных (список с вики OSM, страница «Overpass API»):
#   https://overpass-api.de/api                 - основной (Германия)
#   https://maps.mail.ru/osm/tools/overpass/api - зеркало VK (Россия)
#   https://overpass.private.coffee/api         - зеркало (Австрия)
# 31.10.2026: сработал overpass.kumi.systems (overpass-api.de - 502, private.coffee - 504 и обрыв)
overpass_url: "https://overpass.kumi.systems/api"
overpass_timeout_s: 300  # сколько секунд ждать ответа сервера
# Спрашивать ли у сервера «можно ли уже слать запрос» перед каждым запросом.
# У зеркала maps.mail.ru такой страницы нет, и OSMnx тогда ждёт 60 с впустую,
# поэтому для него ставим false. Для overpass-api.de лучше true.
overpass_rate_limit: false
# Типы дорог, которые не скачиваем вообще
exclude_highway: [motorway, motorway_link, steps, construction, proposed, platform, corridor, elevator]
# Какие теги OSM сохраняем у участков улиц
useful_tags:
  - highway
  - name
  - maxspeed
  - lanes
  - oneway
  - oneway:bicycle
  - cycleway
  - cycleway:left
  - cycleway:right
  - cycleway:both
  - bicycle
  - footway
  - segregated
  - sidewalk
  - access
  - surface
  - tunnel
  - bridge
  # добавлено для метода v0.2 (31.10.2026):
  - service                      # тип проезда: parking_aisle, driveway и т. п.
  - cycleway:separation          # физическая защита велополосы (столбики, бордюр)
  - cycleway:left:separation
  - cycleway:right:separation
  - cycleway:both:separation
  # ширина (31.10.2026): чтобы посчитать, у скольких тротуаров она указана
  - width
  - sidewalk:width
  - sidewalk:left:width
  - sidewalk:right:width
  - sidewalk:both:width
# Точки притяжения: категория -> теги OSM (подходит любой из них)
poi:
  metro_mcd:
    railway: [station]
    station: [subway]
    public_transport: [station]
  train_station:
    building: [train_station]
  university:
    amenity: [university, college]
  office:
    office: true
  park:
    leisure: [park]
